<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MariaDB Manager - Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom dark purple scrollbar */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #070812;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #4c3575;
            border-radius: 8px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #7c5cbf;
        }
        .sql-font {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-[#1b2868] via-[#2f1e5e] to-[#120b24] bg-fixed text-slate-100 h-screen overflow-hidden flex flex-col">

    <!-- Top bar -->
    <header class="h-14 shrink-0 bg-[#080912]/90 backdrop-blur-md border-b border-violet-500/25 flex items-center justify-between pr-5">
        <div class="flex items-center h-full">
            <!-- Left brand aligned with sidebar width -->
            <div class="w-72 shrink-0 px-5 h-full flex items-center gap-3 border-r border-violet-500/20">
                <div class="w-3.5 h-3.5 rounded-full bg-violet-400 shadow-[0_0_10px_rgba(167,139,250,0.85)]"></div>
                <h1 class="text-base font-bold tracking-tight text-white">MariaDB Manager</h1>
            </div>

            <!-- Toolbar icons: Run, Save .sql, Import .sql -->
            <div class="flex items-center gap-1.5 pl-4">
                <button id="btn-run" title="Execute SQL (Ctrl+Enter)"
                    class="p-2 rounded-lg hover:bg-violet-500/15 text-violet-400 hover:text-violet-300 transition flex items-center">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M8 5.14v14l11-7-11-7z"/>
                    </svg>
                </button>

                <button id="btn-save-sql" title="Save SQL to PC (.sql)"
                    class="p-2 rounded-lg hover:bg-violet-500/15 text-violet-400 hover:text-violet-300 transition flex items-center">
                    <svg class="w-5 h-5 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 21v-8H7v8M7 3v5h8"/>
                    </svg>
                </button>

                <button id="btn-import-sql" title="Import SQL from PC (.sql)"
                    class="p-2 rounded-lg hover:bg-violet-500/15 text-violet-400 hover:text-violet-300 transition flex items-center">
                    <svg class="w-5 h-5 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15V9m0 0-2.5 2.5M12 9l2.5 2.5"/>
                    </svg>
                </button>

                <input id="sql-file-input" type="file" accept=".sql,.txt" class="hidden">

                <!-- Active database pill -->
                <div class="ml-2 flex items-center gap-2 text-xs text-violet-200/70 bg-[#0d1024] border border-violet-500/25 px-3 py-1 rounded-full">
                    <span class="text-slate-400">Schema:</span>
                    <span id="active-db-label" class="text-violet-300 font-medium">None selected</span>
                </div>
            </div>
        </div>

        <!-- Right connection info + exit button -->
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5 text-violet-400 fill-current" viewBox="0 0 24 24">
                    <path d="M12 12a4.5 4.5 0 1 0-4.5-4.5A4.5 4.5 0 0 0 12 12zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5z"/>
                </svg>
                <span id="conn-name-label" class="text-sm font-medium text-violet-100">Loading...</span>
            </div>

            <button id="btn-exit" title="Back to Connections"
                class="p-2 rounded-lg hover:bg-violet-500/15 text-violet-400 hover:text-violet-200 transition">
                <svg class="w-5 h-5 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Workspace body -->
    <div class="flex-1 min-h-0 flex">

        <!-- Left sidebar: Database Explorer -->
        <aside class="w-72 shrink-0 bg-[#0a0b14]/90 backdrop-blur-md border-r border-violet-500/25 flex flex-col min-h-0">
            <div class="h-10 shrink-0 px-4 border-b border-violet-500/20 flex items-center justify-between bg-[#080912]/70">
                <span class="text-xs font-semibold uppercase tracking-wider text-violet-200/80">Database Explorer</span>
                <button id="btn-refresh-tree" title="Refresh objects"
                    class="text-xs text-violet-300 hover:text-white px-2 py-0.5 rounded hover:bg-violet-500/20 transition">
                    Refresh
                </button>
            </div>
            <div id="db-tree" class="flex-1 min-h-0 overflow-y-auto p-3 text-sm space-y-1 custom-scroll">
                <p class="text-xs text-slate-400">Loading databases...</p>
            </div>
        </aside>

        <!-- Right split area: SQL Editor (top) + Results (bottom) -->
        <main id="right-pane" class="flex-1 min-w-0 min-h-0 flex flex-col bg-[#0a0b14]/75 backdrop-blur-md">

            <!-- Top pane: SQL Editor -->
            <section id="editor-pane" class="flex flex-col min-h-[140px]" style="height: 52%;">
                <div class="h-10 shrink-0 px-4 border-b border-violet-500/20 bg-[#080912]/80 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <span class="text-sm font-semibold text-violet-100">SQL Editor</span>
                        <span class="text-[11px] text-slate-400">Ctrl+Enter to run</span>
                    </div>
                    <button id="btn-clear-sql" class="text-xs text-slate-400 hover:text-violet-200 px-2 py-1 rounded hover:bg-violet-500/15 transition">
                        Clear
                    </button>
                </div>

                <div class="flex-1 min-h-0 flex bg-[#05060c]/95 overflow-hidden">
                    <!-- Line numbers gutter -->
                    <div id="line-numbers" class="sql-font select-none text-right text-xs text-violet-300/35 bg-[#070812] border-r border-violet-500/15 py-3 px-3 leading-6 overflow-hidden">
                        1
                    </div>
                    <!-- SQL textarea -->
                    <textarea id="sql-input" spellcheck="false" placeholder="Write your SQL query here..."
                        class="sql-font flex-1 bg-transparent text-violet-50 text-sm p-3 leading-6 resize-none focus:outline-none custom-scroll"></textarea>
                </div>
            </section>

            <!-- Draggable horizontal divider -->
            <div id="split-divider" class="h-1.5 shrink-0 bg-[#14172b] hover:bg-violet-500/60 border-y border-violet-500/25 cursor-row-resize transition-colors"></div>

            <!-- Bottom pane: Results -->
            <section id="results-pane" class="flex-1 min-h-[140px] flex flex-col overflow-hidden">
                <div class="h-10 shrink-0 px-4 border-b border-violet-500/20 bg-[#080912]/80 flex items-center justify-between">
                    <span class="text-sm font-semibold text-violet-100">Results</span>
                    <span id="results-meta" class="text-xs text-violet-300/70">Ready</span>
                </div>

                <div id="results-container" class="flex-1 min-h-0 overflow-auto bg-[#05060c]/90 custom-scroll">
                    <div class="h-full flex items-center justify-center text-xs text-slate-500">
                        Run a SQL query or click an object in the Database Explorer to inspect it.
                    </div>
                </div>

                <!-- Pagination bar (shown when browsing tables or views) -->
                <div id="pagination-bar" class="hidden h-10 shrink-0 px-4 border-t border-violet-500/20 bg-[#080912]/90 flex items-center justify-between text-xs">
                    <span id="pagination-info" class="text-violet-200/70">Page 1</span>
                    <div class="flex items-center gap-2">
                        <button id="btn-prev-page" type="button"
                            class="px-3 py-1 rounded-md bg-[#161b3a] hover:bg-[#222957] disabled:opacity-40 disabled:cursor-not-allowed border border-violet-400/30 text-violet-100 transition">
                            Prev
                        </button>
                        <span id="pagination-page-badge" class="px-2.5 py-1 rounded-md bg-[#05060c] border border-violet-500/25 text-violet-300 font-medium">
                            1
                        </span>
                        <button id="btn-next-page" type="button"
                            class="px-3 py-1 rounded-md bg-[#161b3a] hover:bg-[#222957] disabled:opacity-40 disabled:cursor-not-allowed border border-violet-400/30 text-violet-100 transition">
                            Next
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Floating toast popup -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 max-w-sm w-full opacity-0 translate-y-2 pointer-events-none transition-all duration-300">
        <div id="toast-box" class="flex items-start justify-between gap-3 px-4 py-3 rounded-xl shadow-2xl border text-sm">
            <span id="toast-text" class="leading-snug"></span>
            <button id="toast-close" type="button" class="text-xs opacity-70 hover:opacity-100 font-bold px-1">
                X
            </button>
        </div>
    </div>

    <script src="workspace.js"></script>
</body>
</html>
