<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MariaDB Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Barra superior -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-emerald-400"></div>
            <h1 class="text-lg font-bold tracking-tight">Database Manager</h1>
        </div>
        <span id="active-badge" class="text-xs px-3 py-1 rounded-full bg-slate-800 text-slate-400">
            0 conexiones activas
        </span>
    </header>

    <!-- Contenido principal -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-12 gap-6">

        <!-- Panel izquierdo: Conexiones guardadas y activas -->
        <aside class="md:col-span-5 bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col gap-4">
            <div class="flex items-center justify-between">
                <h2 class="font-semibold text-slate-200">Conexiones Guardadas</h2>
                <button id="btn-new" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-emerald-400 font-medium">
                    + Nueva
                </button>
            </div>
            <div id="saved-list" class="space-y-2 text-sm text-slate-400">
                No hay conexiones guardadas aún.
            </div>

            <hr class="border-slate-800 my-2">

            <h2 class="font-semibold text-slate-200">Sesiones Activas</h2>
            <div id="active-list" class="space-y-2 text-sm text-slate-400">
                Ninguna sesión abierta.
            </div>
        </aside>

        <!-- Panel derecho: Formulario + Vista previa de BD -->
        <section class="md:col-span-7 space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                <h2 class="font-semibold text-lg mb-4 text-slate-100">Configurar Conexión</h2>

                <form id="conn-form" class="space-y-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Nombre de la conexión</label>
                        <input id="name" type="text" placeholder="Ej. VPS Local - Root" required
                            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <div class="col-span-2">
                            <label class="block text-xs text-slate-400 mb-1">Host</label>
                            <input id="host" type="text" value="127.0.0.1" required
                                class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Puerto</label>
                            <input id="port" type="number" value="6333" required
                                class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Usuario</label>
                            <input id="user" type="text" placeholder="root o mariadb" required
                                class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Contraseña</label>
                            <input id="password" type="password" placeholder="••••••••"
                                class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Base de datos inicial (opcional)</label>
                        <input id="database" type="text" placeholder="Dejar vacío para ver todas"
                            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    </div>

                    <div id="status-msg" class="hidden text-sm px-4 py-2.5 rounded-lg"></div>

                    <div class="flex gap-3 pt-2">
                        <button type="button" id="btn-test"
                            class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm font-medium transition">
                            Probar Conexión
                        </button>
                        <button type="submit"
                            class="flex-1 px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-sm font-semibold transition">
                            Guardar y Conectar
                        </button>
                    </div>
                </form>
            </div>

            <!-- Resultado al conectar -->
            <div id="db-preview" class="hidden bg-slate-900 border border-slate-800 rounded-xl p-6">
                <div class="flex items-center justify-between mb-3">
                    <h3 id="preview-title" class="font-semibold text-emerald-400"></h3>
                    <span id="preview-version" class="text-xs text-slate-400"></span>
                </div>
                <p class="text-xs text-slate-400 mb-3">Bases de datos detectadas en esta conexión:</p>
                <div id="db-tags" class="flex flex-wrap gap-2"></div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
